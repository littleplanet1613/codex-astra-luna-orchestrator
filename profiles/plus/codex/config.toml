# Codex Plus: Sol orchestrator, Luna execution, Sol research, Astra review, Terra visual QA
#
# Variant of config.toml for Codex Plus users. The root runs GPT-6.1 Sol
# at high reasoning; normal execution subagents use GPT-6 Luna. The reviewer role in
# agents/reviewer.toml is still pinned to Astra for an independent review.
#
# The installer writes this file as <repo>/.codex/config.toml when you
# select the Plus plan. For a personal/global setup, merge these settings
# into ~/.codex/config.toml instead.
#
# Main knobs to change:
#   model / model_reasoning_effort
#   agents.default_subagent_model
#   agents.default_subagent_reasoning_effort
#   agents.max_concurrent_threads_per_session

# Root / orchestrator
model = "gpt-6.1-sol"
model_reasoning_effort = "high"

# Safe interactive defaults. Change if your workflow needs otherwise.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
enabled = true

# Number of child agent threads Codex may keep open concurrently.
# Keep this low on Plus: every concurrent subagent re-reads its own context.
max_concurrent_threads_per_session = 4

# Default for any spawned subagent that does not explicitly choose a model.
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"

[agents."explorer"]
description = "Read-only repository explorer: map files, flows, and existing tests."
config_file = "agents/explorer.toml"

[agents."researcher"]
description = "Read-only versioned research: cite primary docs and constraints."
config_file = "agents/researcher.toml"

[agents."worker"]
description = "Scoped implementation with explicit file ownership."
config_file = "agents/worker.toml"

[agents."tester"]
description = "Targeted independent tests; change tests only when authorized."
config_file = "agents/tester.toml"

[agents."reviewer"]
description = "Read-only independent correctness and security review."
config_file = "agents/reviewer.toml"

[agents."visual-inspector"]
description = "Read-only screenshot and render QA, report observable issues."
config_file = "agents/visual-inspector.toml"
